set-option -g history-limit 25000
set -g mouse on

# vi-style copy mode
setw -g mode-keys vi

# status bar
set -g status-position top
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left ""
set -g status-right "#[fg=#928374]%Y-%m-%d #[fg=#d4be98,bold]%H:%M "
set -g status-right-length 40
set -g status-interval 60

# Gruvbox Material window and pane colours
setw -g window-status-format "#[fg=#928374] #I:#W "
setw -g window-status-current-format "#[fg=#d8a657,bold] #I:#W "
setw -g window-status-activity-style "fg=#e78a4e,bold"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#e78a4e"
set -g message-style "bg=#3c3836,fg=#d8a657,bold"
setw -g mode-style "bg=#d8a657,fg=#282828,bold"

# rename windows to current directory
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# count windows and panes from 1
set -g base-index 1
setw -g pane-base-index 1

# reload config with Ctrl+b then r
bind-key -r r source-file ~/.tmux.conf

# better colours in modern terminals
set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -sa terminal-features ',alacritty:RGB'
