# Lock after one hour of inactivity and keep the lock screen visible.
# This user override replaces Fedora's default rule, which powers the outputs
# off shortly after locking.

exec_always swayidle -w \
    timeout 3600 'swaylock -f' \
    before-sleep 'swaylock -f' \
    lock 'swaylock -f' \
    unlock 'pkill -xu "$USER" -SIGUSR1 swaylock'
