"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Material Dark Hard: terminal background #1d2021, foreground #d4be98.

format = """
($username$hostname${custom.remote_host} )\
$directory\
${custom.branch_unstaged}\
${custom.branch_staged}\
${custom.branch_unborn}\
${custom.branch_behind}\
${custom.branch_ahead}\
${custom.branch_synced}\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
format = '[$user]($style)'
style_user = "#928374"
style_root = "#ea6962"
detect_env_vars = ["REMOTE_CONTAINERS"]

[hostname]
format = '[@$hostname]($style)'
style = "#928374"

[custom.remote_host]
command = 'printf "%s" "${DEVPOD_WORKSPACE_ID:-$(hostname -s)}"'
when = 'test -n "$REMOTE_CONTAINERS"'
format = '[@$output]($style)'
style = "#928374"
os = "linux"

[directory]
style = "#d4be98"

[character]
success_symbol = "[>](#a9b665)"
error_symbol = "[>](#ea6962)"
vimcmd_symbol = "[<](#d3869b)"

# Branch color: amber = changes to add, olive = staged, aqua = push, red = pull, grey = synced.
[custom.branch_unstaged]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"'''
require_repo = true
format = '[$output]($style) '
style = "#b08b4e"

[custom.branch_staged]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''git diff --quiet && test -z "$(git ls-files --others --exclude-standard)" && ! git diff --cached --quiet'''
require_repo = true
format = '[$output]($style) '
style = "#87945d"

[custom.branch_behind]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''test -z "$(git status --porcelain)" && git rev-parse --verify '@{u}' >/dev/null 2>&1 && test "$(git rev-list --count 'HEAD..@{u}')" -gt 0'''
require_repo = true
format = '[$output]($style) '
style = "#b36a65"

[custom.branch_unborn]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''test -z "$(git status --porcelain)" && ! git rev-parse --verify HEAD >/dev/null 2>&1'''
require_repo = true
format = '[$output]($style) '
style = "#928374"

[custom.branch_ahead]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''test -z "$(git status --porcelain)" && git rev-parse --verify HEAD >/dev/null 2>&1 && { ! git rev-parse --verify '@{u}' >/dev/null 2>&1 || { test "$(git rev-list --count 'HEAD..@{u}')" -eq 0 && test "$(git rev-list --count '@{u}..HEAD')" -gt 0; }; }'''
require_repo = true
format = '[$output]($style) '
style = "#688b82"

[custom.branch_synced]
command = '''git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD'''
when = '''test -z "$(git status --porcelain)" && git rev-parse --verify '@{u}' >/dev/null 2>&1 && test "$(git rev-list --count 'HEAD..@{u}')" -eq 0 && test "$(git rev-list --count '@{u}..HEAD')" -eq 0'''
require_repo = true
format = '[$output]($style) '
style = "#928374"

[cmd_duration]
format = "[$duration]($style) "
style = "#928374"

[python]
format = "[$virtualenv]($style) "
style = "#928374"
detect_extensions = []
detect_files = []
