"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "#d8a657"

[character]
success_symbol = "[❯](#e78a4e)"
error_symbol = "[❯](#ea6962)"
vimcmd_symbol = "[❮](#d3869b)"

[git_branch]
format = "[$branch]($style)"
style = "#d8a657"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#d3869b) ($ahead_behind$stashed)]($style)"
style = "#d3869b"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#928374"

[cmd_duration]
format = "[$duration]($style) "
style = "#e78a4e"

[python]
format = "[$virtualenv]($style) "
style = "#928374"
detect_extensions = []
detect_files = []
