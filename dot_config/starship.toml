"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Material Dark Hard: terminal background #1d2021, foreground #d4be98.

format = """
($username$hostname${custom.remote_host} )\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
format = '[$user]($style)'
style_user = "#928374"
style_root = "#ea6962"
detect_env_vars = ["REMOTE_CONTAINERS"]

[hostname]
format = '[@$hostname]($style)'
style = "#928374"

[custom.remote_host]
command = 'printf "%s" "${DEVPOD_WORKSPACE_ID:-$(hostname -s)}"'
when = 'test -n "$REMOTE_CONTAINERS"'
format = '[@$output]($style)'
style = "#928374"
os = "linux"

[directory]
style = "#d4be98"

[character]
success_symbol = "[>](#a9b665)"
error_symbol = "[>](#ea6962)"
vimcmd_symbol = "[<](#d3869b)"

# The built-in Git modules avoid six separate custom commands on every prompt.
[git_branch]
format = '[$branch]($style) '
style = "#928374"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#928374"
conflicted = '[!](#ea6962)'
untracked = '[?](#b08b4e)'
modified = '[~](#b08b4e)'
staged = '[+](#87945d)'
renamed = '[»](#87945d)'
deleted = '[-](#b08b4e)'
ahead = '[⇡](#688b82)'
behind = '[⇣](#b36a65)'
diverged = '[⇕](#ea6962)'

[cmd_duration]
format = "[$duration]($style) "
style = "#928374"

[python]
format = "[$virtualenv]($style) "
style = "#928374"
detect_extensions = []
detect_files = []
