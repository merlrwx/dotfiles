"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Material Dark palette, coordinated with Alacritty and ble.sh:
# hard background #1d2021, surface #32302f, foreground #d4be98,
# muted #a89984, subtle #928374, red #d2746e, green #9eaa72,
# amber #c1a06d, blue #83a598, aqua #89a58e, purple #b88c9b.

format = """
($username$hostname${custom.remote_host} )\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
format = '[$user]($style)'
style_user = "#928374"
style_root = "#d2746e"
detect_env_vars = ["REMOTE_CONTAINERS"]

[hostname]
format = '[@$hostname]($style)'
style = "#928374"

[custom.remote_host]
command = 'printf "%s" "${DEVPOD_WORKSPACE_ID:-$(hostname -s)}"'
when = 'test -n "$REMOTE_CONTAINERS"'
format = '[@$output]($style)'
style = "#928374"
os = "linux"

[directory]
style = "#c1ac83"

[character]
success_symbol = "[❯](#9eaa72)"
error_symbol = "[❯](#d2746e)"
vimcmd_symbol = "[❮](#b88c9b)"

[git_branch]
format = "[ $branch]($style)"
style = "#83a598"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#c1a06d) ($ahead_behind$stashed)]($style)"
style = "#c1a06d"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#928374"

[cmd_duration]
format = "[$duration]($style) "
style = "#928374"

[python]
format = "[$virtualenv]($style) "
style = "#928374"
detect_extensions = []
detect_files = []
