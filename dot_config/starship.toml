"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Material Dark palette, coordinated with Alacritty and ble.sh:
# hard background #1d2021, surface #32302f, foreground #d4be98,
# muted #a89984, subtle #928374, red #ea6962, green #a9b665,
# amber #d8a657, blue #7daea3, aqua #89b482, purple #d3869b.

format = """
($username$hostname${custom.remote_host} )\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
format = '[$user]($style)'
style_user = "#928374"
style_root = "#ea6962"
detect_env_vars = ["REMOTE_CONTAINERS"]

[hostname]
format = '[@$hostname]($style)'
style = "#928374"

[custom.remote_host]
command = 'printf "%s" "${DEVPOD_WORKSPACE_ID:-$(hostname -s)}"'
when = 'test -n "$REMOTE_CONTAINERS"'
format = '[@$output]($style)'
style = "#928374"
os = "linux"

[directory]
style = "#d8a657"

[character]
success_symbol = "[❯](#a9b665)"
error_symbol = "[❯](#ea6962)"
vimcmd_symbol = "[❮](#d3869b)"

[git_branch]
format = "[ $branch]($style)"
style = "#7daea3"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](#d3869b) ($ahead_behind$stashed)]($style)"
style = "#ea6962"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#a89984"

[cmd_duration]
format = "[$duration]($style) "
style = "#928374"

[python]
format = "[$virtualenv]($style) "
style = "#a89984"
detect_extensions = []
detect_files = []
