"$schema" = 'https://starship.rs/config-schema.json'

# Gruvbox Material Dark Hard: terminal background #1d2021, foreground #d4be98.

format = """
($username$hostname${custom.remote_host} )\
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[username]
format = '[$user]($style)'
style_user = "#928374"
style_root = "#ea6962"
detect_env_vars = ["REMOTE_CONTAINERS"]

[hostname]
format = '[@$hostname]($style)'
style = "#928374"

[custom.remote_host]
command = 'printf "%s" "${DEVPOD_WORKSPACE_ID:-$(hostname -s)}"'
when = 'test -n "$REMOTE_CONTAINERS"'
format = '[@$output]($style)'
style = "#928374"
os = "linux"

[directory]
style = "#d4be98"

[character]
success_symbol = "[>](#a9b665)"
error_symbol = "[>](#ea6962)"
vimcmd_symbol = "[<](#d3869b)"

[git_branch]
format = '[\($branch\)]($style) '
style = "bold #7daea3"

[git_status]
format = "$conflicted$untracked$modified$staged$renamed$deleted$typechanged$ahead_behind$stashed"
conflicted = "[CONFLICT ${count}](bold #ea6962) "
untracked = "[? ${count} untracked](bold #d8a657) "
modified = "[! ${count} modified](bold #e78a4e) "
staged = "[+ ${count} staged](bold #a9b665) "
renamed = "[> ${count} renamed](#7daea3) "
deleted = "[- ${count} deleted](bold #ea6962) "
typechanged = "[~ ${count} type-changed](#d3869b) "
ahead = "[^ ${count} ahead](bold #a9b665) "
behind = "[v ${count} behind](bold #e78a4e) "
diverged = "[<> ${ahead_count} ahead/${behind_count} behind](bold #ea6962) "
up_to_date = "[up to date](bold #a9b665) "
stashed = "[= ${count} stashed](#928374) "
style = "#d4be98"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "#928374"

[cmd_duration]
format = "[$duration]($style) "
style = "#928374"

[python]
format = "[$virtualenv]($style) "
style = "#928374"
detect_extensions = []
detect_files = []
