onboarding = false

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "priority"

[worktrees]
directory = "~/.herdr/worktrees"

[session]
resume_agents_on_restore = true

# Keep Herdr's prefix distinct from the outer tmux Ctrl-b prefix. This lets
# Herdr shortcuts pass through a local tmux session while SSH'd into this host.
[keys]
prefix = "f12"
